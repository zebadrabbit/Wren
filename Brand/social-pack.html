<title>Wren — social &amp; repo pack</title>
<style>
/* Wren — design tokens. Warm, domestic, local-first.
 *
 * Every ratio in a comment below is measured, not estimated: src/contrast.py
 * computes it and the brand page recomputes all of them live in the browser,
 * so a colour that gets nudged and quietly stops meeting AA shows up as a red
 * cell rather than as a stale comment.
 *
 * Light ratios are against --w-paper (#F4EDE2), dark against --w-night
 * (#241F1A). "AA" means >= 4.5:1, the threshold for normal-size body text.
 */
:root {
  /* ---- ground: the daylight surfaces ------------------------------------ */
  --w-paper:    #F4EDE2;   /* page field — the cream everything sits on */
  --w-surface:  #FBF7F0;   /* raised: cards, the chat composer, popovers */
  --w-sunk:     #EBE2D4;   /* recessed: code blocks, inset wells */
  --w-line:     #DDD0BC;   /* hairlines, dividers, input borders */
  --w-line-2:   #C9B9A1;   /* emphasised border, focus ring track */

  /* ---- ink -------------------------------------------------------------- */
  --w-ink:      #3A322B;   /* 10.81:1  body text, the wordmark */
  --w-ink-2:    #6E6255;   /*  5.10:1  secondary text, labels */
  --w-ink-3:    #726450;   /*  4.94:1  smallest permitted text colour — AA */

  /* ---- accents ---------------------------------------------------------- */
  /* Clay is the bird and the brand. It is a LARGE-TEXT / graphic colour at
     3.30:1 — fine for the mark, headings 24px+, borders and fills; not fine
     for body copy. Use --w-clay-ink when clay has to carry small text. */
  --w-clay:      #C4694A;  /*  3.30:1  graphic use, mark, large display type */
  --w-clay-ink:  #A04E33;  /*  4.97:1  clay as *text*, and as a button fill
                                       under cream text (cream on it: 4.97:1) */
  --w-clay-soft: #E9CDBF;  /* tint: selected rows, hover wash, chart fills */

  --w-moss:      #6B7F5C;  /*  3.75:1  graphic use, large type only */
  --w-moss-ink:  #55684A;  /*  5.21:1  moss as text (cream on it: 5.21:1) */
  --w-moss-soft: #D8E0CE;  /* tint */

  /* ---- signals ---------------------------------------------------------- */
  /* Warm rather than clinical: this is an assistant in a kitchen, not a
     control room. All three clear AA against paper. */
  --w-ok:     #4F7343;     /*  4.67:1  done, on the list, delivered */
  --w-warn:   #8F5F10;     /*  4.74:1  needs attention, provider fell back */
  --w-alert:  #B4462F;     /*  4.68:1  failed, unreachable, destructive */

  /* ---- night: the same system after dark -------------------------------- */
  --w-night:         #241F1A;
  --w-night-surface: #2E2822;
  --w-night-sunk:    #1B1713;
  --w-night-line:    #443C33;
  --w-night-ink:     #F4EDE2;  /* 14.04:1 */
  --w-night-ink-2:   #C4B7A5;  /*  8.29:1 */
  --w-night-ink-3:   #9C8E7C;  /*  5.11:1 */
  --w-night-clay:    #E08D6C;  /*  6.37:1  clay lifted to stay legible on night */
  --w-night-moss:    #9CB388;  /*  7.17:1 */

  /* ---- type -------------------------------------------------------------
     The wordmark ships as outlines, so nothing here has to match it exactly.
     For running text the stack is a humanist/geometric sans that degrades to
     the system UI font with no webfont fetch — a local-first assistant that
     phones a CDN for a typeface would be missing the point. */
  --w-sans: "Inter", "Source Sans 3", -apple-system, BlinkMacSystemFont,
            "Segoe UI", Roboto, system-ui, sans-serif;
  --w-display: "TeX Gyre Adventor", "Poppins", "Century Gothic", var(--w-sans);
  --w-mono: "JetBrains Mono", "IBM Plex Mono", ui-monospace, "SF Mono",
            "Cascadia Mono", Consolas, "Liberation Mono", monospace;

  /* Type scale — 1.25 (major third), rounded to whole px. Warm brands read
     better a little larger and a little looser than technical ones. */
  --w-t-xs:   12px;
  --w-t-sm:   14px;
  --w-t-base: 16px;
  --w-t-md:   20px;
  --w-t-lg:   25px;
  --w-t-xl:   31px;
  --w-t-2xl:  39px;
  --w-t-3xl:  49px;

  --w-lh-tight: 1.18;   /* display */
  --w-lh-snug:  1.35;   /* headings, UI */
  --w-lh-body:  1.6;    /* running text */
  --w-track-display: -0.015em;
  --w-track-label:    0.08em;

  /* ---- form ------------------------------------------------------------- */
  /* Rounded, but not pill-shaped: soft corners read domestic, full pills read
     like a consumer app trying too hard. */
  --w-r-sm:  6px;
  --w-r-md:  10px;
  --w-r-lg:  16px;
  --w-r-xl:  24px;

  --w-space: 8px;                    /* the grid everything else is a multiple of */
  --w-shadow-sm: 0 1px 2px rgba(58, 50, 43, .07);
  --w-shadow-md: 0 2px 8px rgba(58, 50, 43, .09);
  --w-shadow-lg: 0 8px 28px rgba(58, 50, 43, .12);

  /* Clear space around the mark, as a multiple of its own height. Nothing —
     type, edge of canvas, another logo — comes inside this. */
  --w-mark-clearspace: 0.35;
  --w-mark-min-px: 20px;             /* below this, use the simple mark */
}

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--w-sunk); color: var(--w-ink);
  font-family: var(--w-sans); font-size: var(--w-t-base); line-height: var(--w-lh-body);
}
header {
  padding: 40px 32px 26px; background: var(--w-paper);
  border-bottom: 1px solid var(--w-line);
}
header h1 { font-family: var(--w-display); font-size: var(--w-t-2xl); margin: 0 0 6px;
  letter-spacing: var(--w-track-display); font-weight: 600; }
header p { margin: 0; color: var(--w-ink-2); max-width: 68ch; }
main { padding: 28px 32px 80px; display: flex; flex-direction: column; gap: 30px; }
section.item { background: var(--w-paper); border: 1px solid var(--w-line);
  border-radius: var(--w-r-lg); overflow: hidden; }
.bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 12px 16px; border-bottom: 1px solid var(--w-line); background: var(--w-surface); }
.bar b { font-size: var(--w-t-sm); font-weight: 600; }
.bar code { font-family: var(--w-mono); font-size: var(--w-t-xs); color: var(--w-ink-3); }
.bar .sp { flex: 1; }
button { font: inherit; font-size: var(--w-t-xs); letter-spacing: var(--w-track-label);
  text-transform: uppercase; padding: 7px 12px; border-radius: var(--w-r-sm);
  border: 1px solid var(--w-line-2); background: var(--w-paper); color: var(--w-ink);
  cursor: pointer; }
button:hover { background: var(--w-clay-soft); border-color: var(--w-clay); }
.stage { padding: 20px; display: flex; justify-content: center;
  background: repeating-conic-gradient(var(--w-sunk) 0 25%, transparent 0 50%) 50%/22px 22px; }
.stage svg { max-width: 100%; height: auto; display: block;
  box-shadow: var(--w-shadow-md); border-radius: 2px; }
.note { padding: 0 16px 14px; font-size: var(--w-t-sm); color: var(--w-ink-2); }
</style>

const PAL = {
  paper:'#F4EDE2', surface:'#FBF7F0', sunk:'#EBE2D4', line:'#DDD0BC', line2:'#C9B9A1',
  ink:'#3A322B', ink2:'#6E6255', ink3:'#726450',
  clay:'#C4694A', clayInk:'#A04E33', claySoft:'#E9CDBF', clayDeep:'#A9553A',
  moss:'#6B7F5C', mossInk:'#55684A', mossSoft:'#D8E0CE',
  night:'#241F1A', nightSurface:'#2E2822', nightLine:'#443C33',
  nightInk:'#F4EDE2', nightInk2:'#C4B7A5', nightClay:'#E08D6C'

const SANS = "Inter, 'Source Sans 3', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif";
const MONO = "'JetBrains Mono','IBM Plex Mono',ui-monospace,'SF Mono',Consolas,monospace";

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* ---- brand primitives, all driven by the generated LOGO geometry ---- */
function bird(x, y, size, fill, o) {
  o = o || {};
  const k = size / 100, g = LOGO.geometry;
  let s = `<g transform="translate(${x},${y}) scale(${k})">`;
  s += `<path d="${g.body}" fill="${fill}"/>`;
  if (!o.simple) {
    s += `<path d="${g.wing}" fill="${o.wing || PAL.clayDeep}"/>`;
    s += `<path d="${g.brow}" fill="${o.detail || PAL.paper}"/>`;
    s += `<circle cx="${g.eye.cx}" cy="${g.eye.cy}" r="${g.eye.r}" fill="${o.detail || PAL.paper}"/>`;
  }
  return s + '</g>';
}
/* Wordmark outlines are emitted at size 64 with the baseline at y=0. */
function word(x, y, size, fill) {
  const k = size / 64;
  return `<g transform="translate(${x},${y}) scale(${k})"><path d="${LOGO.wordmark.d}" fill="${fill}"/></g>`;
}
const wordWidth = size => LOGO.wordmark.width * size / 64;

/* Horizontal lockup, returned with its measured width so callers can centre it. */
function lockup(x, y, size, inkFill, markFill, o) {
  o = o || {};
  const ms = size * 1.75, gap = size * 0.34;
  const w = ms + gap + wordWidth(size);
  const s = bird(x, y, ms, markFill, o) + word(x + ms + gap, y + ms * 0.62 + size * 0.24, size, inkFill);
  return { svg: s, w: w, h: ms };
}
function text(x, y, str, o) {
  o = o || {};
  return `<text x="${x}" y="${y}" fill="${o.fill || PAL.ink}" font-family="${o.mono ? MONO : SANS}"`
    + ` font-size="${o.size || 20}" font-weight="${o.weight || 400}"`
    + (o.spacing ? ` letter-spacing="${o.spacing}"` : '')
    + (o.anchor ? ` text-anchor="${o.anchor}"` : '') + `>${esc(str)}</text>`;
}
function rect(x, y, w, h, fill, r, stroke, sw) {
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${fill}"`
    + (r ? ` rx="${r}"` : '') + (stroke ? ` stroke="${stroke}" stroke-width="${sw || 1}"` : '') + '/>';
}
/* A hairline of stacked chevrons — the one repeating motif in the system. */
function perch(x, y, w, colour, op) {
  return `<path d="M ${x} ${y} L ${x + w} ${y}" stroke="${colour}" stroke-width="2"`
    + ` opacity="${op == null ? 0.5 : op}" stroke-linecap="round"/>`;
}

/* ---------------------------------------------------------------- render */
const svgOf = c =>
  `<svg xmlns="http://www.w3.org/2000/svg" width="${c.w}" height="${c.h}" viewBox="0 0 ${c.w} ${c.h}">${c.render()}</svg>`;

function download(name, blob) {
  const u = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = u; a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(u), 4000);
}
function saveSVG(c) {
  download(c.id + '.svg', new Blob([svgOf(c)], { type: 'image/svg+xml' }));
}
function savePNG(c, scale) {
  const img = new Image();
  const blob = new Blob([svgOf(c)], { type: 'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  img.onload = () => {
    const cv = document.createElement('canvas');
    cv.width = c.w * scale; cv.height = c.h * scale;
    const g = cv.getContext('2d');
    g.drawImage(img, 0, 0, cv.width, cv.height);
    cv.toBlob(b => download(`${c.id}-${c.w * scale}x${c.h * scale}.png`, b));
    URL.revokeObjectURL(url);
  };
  img.src = url;
}

const main = document.getElementById('main');
CARDS.forEach(c => {
  const sec = document.createElement('section');
  sec.className = 'item';
  sec.innerHTML =
    `<div class="bar"><b>${esc(c.label)}</b><code>${c.w}×${c.h}</code><span class="sp"></span>
       <button data-a="svg">SVG</button><button data-a="p1">PNG @1×</button><button data-a="p2">PNG @2×</button></div>
     <div class="stage">${svgOf(c)}</div>` +
    (c.note ? `<p class="note">${esc(c.note)}</p>` : '');
  sec.querySelector('[data-a="svg"]').onclick = () => saveSVG(c);
  sec.querySelector('[data-a="p1"]').onclick = () => savePNG(c, 1);
  sec.querySelector('[data-a="p2"]').onclick = () => savePNG(c, 2);
  main.appendChild(sec);
});
