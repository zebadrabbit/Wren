<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wren</title>
<style>
:root {
  --bg: #faf9f7; --panel: #f0eeea; --line: #ddd9d2; --text: #26241f;
  --muted: #6f6a61; --accent: #5b6f4e; --bubble-user: #e4e9de; --code: #eceae5;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1a1917; --panel: #221f1c; --line: #34302b; --text: #ece8e1;
    --muted: #9a938a; --accent: #9dbb87; --bubble-user: #2b3327; --code: #14130f;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  display: flex; background: var(--bg); color: var(--text);
  font: 15px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
}
button { font: inherit; color: inherit; cursor: pointer; }

/* ── login ─────────────────────────────────────────────────────────────── */
#login { margin: auto; max-width: 380px; padding: 24px; text-align: center; }
#login h1 { font-size: 22px; margin: 0 0 4px; }
#login p { color: var(--muted); margin: 0 0 20px; font-size: 14px; }
#login input {
  width: 100%; padding: 10px 12px; border: 1px solid var(--line);
  border-radius: 8px; background: var(--panel); color: var(--text); font: inherit;
}
#login button {
  width: 100%; margin-top: 10px; padding: 10px; border: 0; border-radius: 8px;
  background: var(--accent); color: var(--bg); font-weight: 600;
}
#login .err { color: #c0503f; font-size: 13px; min-height: 18px; margin-top: 8px; }

/* ── layout ────────────────────────────────────────────────────────────── */
#app { display: none; width: 100%; height: 100%; }
#app.on { display: flex; }
aside {
  width: 250px; flex: none; background: var(--panel);
  border-right: 1px solid var(--line); display: flex; flex-direction: column;
}
aside header {
  padding: 12px; border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 8px;
}
aside header b { flex: 1; font-size: 15px; }
#new {
  border: 1px solid var(--line); background: transparent; border-radius: 6px;
  padding: 4px 10px; font-size: 13px;
}
#convos { flex: 1; overflow-y: auto; padding: 6px; }
.convo {
  display: flex; align-items: center; gap: 4px; padding: 7px 9px;
  border-radius: 6px; cursor: pointer; font-size: 14px;
}
.convo:hover { background: var(--bg); }
.convo.active { background: var(--bg); font-weight: 600; }
.convo span {
  flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.convo button {
  border: 0; background: transparent; color: var(--muted); padding: 2px 4px;
  border-radius: 4px; font-size: 12px; opacity: 0; line-height: 1;
}
.convo:hover button { opacity: 1; }
.convo button:hover { background: var(--line); }

/* ── plugins panel ─────────────────────────────────────────────────────── */
#plugins { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: flex; justify-content: flex-end; }
#plugins[hidden] { display: none; }
#plugins .sheet {
  width: 420px; max-width: 100%; background: var(--bg); height: 100%;
  display: flex; flex-direction: column; border-left: 1px solid var(--line);
}
#plugins header {
  display: flex; align-items: center; padding: 12px 16px;
  border-bottom: 1px solid var(--line);
}
#plugins header b { flex: 1; }
#plugins .pbody { flex: 1; overflow-y: auto; padding: 16px; }
#plugins h4 { margin: 18px 0 8px; font-size: 12px; letter-spacing: .08em;
              text-transform: uppercase; color: var(--muted); }
#plugins h4 small { text-transform: none; letter-spacing: 0; font-weight: 400; }
.prow { display: flex; align-items: center; gap: 8px; padding: 8px 0;
        border-bottom: 1px solid var(--line); }
.prow .pname { flex: 1; }
.prow .why { flex-basis: 100%; color: var(--muted); font-size: 13px; }
.pset { display: flex; align-items: center; gap: 8px; padding: 6px 0; }
.pset label { flex: 1; font-size: 14px; }
.pset input { width: 190px; padding: 6px 8px; border: 1px solid var(--line);
              border-radius: 6px; background: var(--panel); color: var(--text); font: inherit; }
.perr { color: #c0503f; font-size: 13px; padding: 0 16px 12px; min-height: 18px; }

main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
#log { flex: 1; overflow-y: auto; padding: 24px 20px; }
#inner { max-width: 720px; margin: 0 auto; }
.msg { margin-bottom: 18px; display: flex; }
.msg.user { justify-content: flex-end; }
.msg .body {
  max-width: 82%; padding: 10px 14px; border-radius: 12px; overflow-wrap: anywhere;
}
.msg.user .body { background: var(--bubble-user); }
.msg.assistant .body { background: transparent; padding-left: 0; max-width: 100%; }
.msg .body > :first-child { margin-top: 0; }
.msg .body > :last-child { margin-bottom: 0; }
.msg pre {
  background: var(--code); padding: 10px 12px; border-radius: 8px;
  overflow-x: auto; font-size: 13px;
}
.msg code {
  background: var(--code); padding: 1px 5px; border-radius: 4px;
  font-size: 13px; font-family: ui-monospace, "SF Mono", Menlo, monospace;
}
.msg pre code { background: none; padding: 0; }
.msg a { color: var(--accent); }
.msg ul { padding-left: 20px; margin: 6px 0; }
.msg .dl { display: inline-block; margin-top: 6px; color: var(--accent); }
#empty { color: var(--muted); text-align: center; margin-top: 22vh; font-size: 14px; }
.dots span {
  display: inline-block; width: 6px; height: 6px; margin-right: 3px;
  border-radius: 50%; background: var(--muted); animation: b 1.2s infinite;
}
.dots span:nth-child(2) { animation-delay: .2s }
.dots span:nth-child(3) { animation-delay: .4s }
@keyframes b { 0%,60%,100% { opacity:.25 } 30% { opacity:1 } }

footer { border-top: 1px solid var(--line); padding: 12px 20px; }
#composer { max-width: 720px; margin: 0 auto; display: flex; gap: 8px; }
#text {
  flex: 1; resize: none; padding: 10px 12px; border: 1px solid var(--line);
  border-radius: 10px; background: var(--panel); color: var(--text);
  font: inherit; max-height: 180px;
}
#send {
  border: 0; border-radius: 10px; background: var(--accent); color: var(--bg);
  padding: 0 18px; font-weight: 600;
}
#send:disabled { opacity: .5; cursor: default; }
@media (max-width: 640px) { aside { width: 190px; } }
</style>
</head>
<body>

<div id="login">
  <h1>Wren</h1>
  <p>Paste a token from this Wren's <code>WREN_TOKENS</code> — the part
     <em>before</em> the colon. What follows it is the user id, not the token.</p>
  <input id="token" type="password" placeholder="token" autocomplete="current-password">
  <button id="signin">Connect</button>
  <div class="err" id="loginerr"></div>
</div>

<div id="app">
  <aside>
    <header><b>Wren</b><button id="gear" title="Plugins">⚙</button><button id="new">New</button></header>
    <div id="convos"></div>
  </aside>
  <main>
    <div id="log"><div id="inner"></div></div>
    <footer>
      <div id="composer">
        <textarea id="text" rows="1" placeholder="Message Wren…"></textarea>
        <button id="send">Send</button>
      </div>
    </footer>
  </main>
</div>

<div id="plugins" hidden>
  <div class="sheet">
    <header><b>Plugins</b><button id="pclose">✕</button></header>
    <div class="pbody">
      <h4>Skills</h4><div id="pskills"></div>
      <h4>Channels <small>restart required</small></h4><div id="pchannels"></div>
      <h4>Settings</h4><div id="psettings"></div>
    </div>
    <div class="perr" id="perr"></div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
let token = localStorage.getItem("wren_token") || "";
let active = null, busy = false;

/* ── markdown ───────────────────────────────────────────────────────────
   Replies can contain text Wren did not write: web_skill summarises scraped
   pages and send_to_person relays other users' messages. So escape FIRST,
   then apply a fixed whitelist to the already-escaped string — this can never
   emit a tag the escaper didn't already neutralise. */
function esc(s) {
  // strip the private-use codepoint md() reserves for its code-fence
  // placeholders — otherwise text containing it could forge a placeholder and
  // resolve to an out-of-range block, rendering as "undefined"
  return s.replace(/\uE000/g, "")
          .replace(/&/g, "&amp;").replace(/</g, "&lt;")
          .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function md(src) {
  const blocks = [];
  let out = esc(src);
  // Fenced code first, parked so its contents aren't re-processed. The
  // placeholder uses a private-use codepoint, written as a JS escape so no
  // raw control byte lands in the HTML. A " 3 " style placeholder would
  // collide with any standalone number in prose ("step 3 of the process").
  out = out.replace(/```([\s\S]*?)```/g, (_, code) =>
    "\uE000" + (blocks.push("<pre><code>" + code.replace(/^\n/, "") + "</code></pre>") - 1) + "\uE000");
  out = out.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  out = out.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  out = out.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
  // only http/https survive — a javascript: href must not be constructible
  out = out.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  out = out.replace(/(^|\s)(https?:\/\/[^\s<]+)/g,
    '$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>');
  out = out.replace(/(?:^|\n)((?:[-*] .+\n?)+)/g, m =>
    "<ul>" + m.trim().split("\n").map(l => "<li>" + l.replace(/^[-*] /, "") + "</li>").join("") + "</ul>");
  out = out.replace(/\n/g, "<br>");
  return out.replace(/\uE000(\d+)\uE000/g, (_, i) => blocks[i]);
}

async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: { "Authorization": "Bearer " + token, "Content-Type": "application/json",
               ...(opts.headers || {}) },
  });
  if (res.status === 401) { signOut(); throw new Error("unauthorized"); }
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.statusText);
  return res.json();
}

function signOut() {
  localStorage.removeItem("wren_token"); token = "";
  $("#app").classList.remove("on"); $("#login").style.display = "";
  $("#loginerr").textContent = "That token was rejected.";
}

/* ── rendering ─────────────────────────────────────────────────────────── */
function bubble(role, html) {
  const d = document.createElement("div");
  d.className = "msg " + role;
  d.innerHTML = '<div class="body">' + html + "</div>";
  $("#inner").append(d);
  $("#log").scrollTop = $("#log").scrollHeight;
  return d;
}
function fileLink(f) {
  return '<a class="dl" download="' + esc(f.filename) +
         '" href="data:application/octet-stream;base64,' + f.data + '">⤓ ' +
         esc(f.filename) + "</a>";
}

async function loadConvos() {
  const list = await api("/api/conversations");
  const box = $("#convos");
  box.innerHTML = "";
  for (const c of list) {
    const el = document.createElement("div");
    el.className = "convo" + (c.id === active ? " active" : "");
    const name = document.createElement("span");
    name.textContent = c.title;
    el.append(name);
    for (const [label, fn] of [["✎", () => renameConvo(c)], ["✕", () => delConvo(c)]]) {
      const b = document.createElement("button");
      b.textContent = label;
      b.onclick = e => { e.stopPropagation(); fn(); };
      el.append(b);
    }
    el.onclick = () => openConvo(c.id);
    box.append(el);
  }
}

async function renameConvo(c) {
  const title = prompt("Rename conversation", c.title);
  if (title === null || !title.trim()) return;
  await api("/api/conversations/" + c.id, { method: "PATCH", body: JSON.stringify({ title }) });
  loadConvos();
}
async function delConvo(c) {
  if (!confirm("Delete “" + c.title + "”?")) return;
  await api("/api/conversations/" + c.id, { method: "DELETE" });
  if (active === c.id) { active = null; $("#inner").innerHTML = ""; showEmpty(); }
  loadConvos();
}
function showEmpty() {
  $("#inner").innerHTML = '<div id="empty">Ask Wren anything — or say “add potatoes to shopping”.</div>';
}

async function openConvo(id) {
  active = id;
  const convo = await api("/api/conversations/" + id);
  $("#inner").innerHTML = "";
  if (!convo.messages.length) showEmpty();
  for (const m of convo.messages) {
    bubble(m.role, m.role === "user" ? esc(m.content) : md(m.content));
  }
  loadConvos();
  $("#text").focus();
}

async function newConvo() {
  const c = await api("/api/conversations", { method: "POST" });
  await loadConvos();
  await openConvo(c.id);
}

async function send() {
  const text = $("#text").value.trim();
  if (!text || busy) return;
  if (active === null) await newConvo();
  busy = true; $("#send").disabled = true;
  $("#text").value = ""; $("#text").style.height = "auto";
  const gone = $("#empty"); if (gone) gone.remove();
  bubble("user", esc(text));
  const thinking = bubble("assistant", '<div class="dots"><span></span><span></span><span></span></div>');
  try {
    const data = await api("/api/conversations/" + active + "/message",
                           { method: "POST", body: JSON.stringify({ text }) });
    thinking.remove();
    for (const r of data.replies) bubble("assistant", md(r));
    for (const f of data.files || []) bubble("assistant", fileLink(f));
    if (!data.replies.length && !(data.files || []).length) bubble("assistant", "<em>(no reply)</em>");
    loadConvos();
  } catch (e) {
    thinking.remove();
    bubble("assistant", '<em>' + esc(e.message || "Something went wrong.") + "</em>");
  } finally {
    busy = false; $("#send").disabled = false; $("#text").focus();
  }
}

/* ── plugins panel ─────────────────────────────────────────────────────── */
async function loadPlugins() {
  const d = await api("/api/plugins");

  $("#pskills").innerHTML = "";
  d.skills.forEach(s => {
    const row = document.createElement("div");
    row.className = "prow";
    row.innerHTML = `<span class="pname"></span>
                     <button class="ptoggle">${s.enabled ? "on" : "off"}</button>`;
    row.querySelector(".pname").textContent = s.name;
    row.querySelector(".ptoggle").onclick = async () => {
      await api(`/api/plugins/${s.module}`,
                { method: "PATCH", body: JSON.stringify({ enabled: !s.enabled }) });
      loadPlugins();
    };
    if (s.reason) {
      const why = document.createElement("div");
      why.className = "why";
      why.textContent = s.reason;
      row.appendChild(why);
    }
    $("#pskills").appendChild(row);
  });

  // Channels are read-only status: COMMUNICATION_PLUGINS is read once by
  // run.py at startup, so a toggle here could never take effect -- the
  // endpoint itself refuses with a 400 for this reason.
  $("#pchannels").innerHTML = "";
  d.channels.forEach(c => {
    const row = document.createElement("div");
    row.className = "prow";
    row.innerHTML = `<span class="pname"></span><span>${c.running ? "● live" : "○ off"}</span>`;
    row.querySelector(".pname").textContent = `${c.name} (${c.role})`;
    if (c.reason) {
      const why = document.createElement("div");
      why.className = "why";
      why.textContent = c.reason;
      row.appendChild(why);
    }
    $("#pchannels").appendChild(row);
  });

  $("#psettings").innerHTML = "";
  Object.entries(d.settings).forEach(([key, value]) => {
    const row = document.createElement("div");
    row.className = "pset";
    row.innerHTML = `<label></label><input>`;
    row.querySelector("label").textContent = key;
    const input = row.querySelector("input");
    input.value = value;
    input.onchange = async () => {
      $("#perr").textContent = "";
      try {
        await api("/api/settings",
                  { method: "PATCH", body: JSON.stringify({ [key]: input.value }) });
      } catch (e) {
        $("#perr").textContent = String(e.message || e);
      }
      loadPlugins();
    };
    $("#psettings").appendChild(row);
  });
}

/* ── wiring ────────────────────────────────────────────────────────────── */
$("#signin").onclick = async () => {
  const v = $("#token").value.trim();
  if (!v) return;
  token = v;
  try {
    await api("/api/conversations");
    localStorage.setItem("wren_token", v);
    start();
  } catch { $("#loginerr").textContent = "That token was rejected."; }
};
$("#token").onkeydown = e => { if (e.key === "Enter") $("#signin").click(); };
$("#new").onclick = newConvo;
$("#send").onclick = send;
$("#text").onkeydown = e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
};
$("#text").oninput = e => {
  e.target.style.height = "auto";
  e.target.style.height = Math.min(e.target.scrollHeight, 180) + "px";
};
$("#gear").onclick = () => { $("#plugins").hidden = false; loadPlugins(); };
$("#pclose").onclick = () => { $("#plugins").hidden = true; };
$("#plugins").onclick = e => { if (e.target.id === "plugins") $("#plugins").hidden = true; };

async function start() {
  $("#login").style.display = "none";
  $("#app").classList.add("on");
  // The endpoint 403s for non-owners -- use that to decide whether the gear
  // is even shown, and fail closed (hidden) on any error rather than risk
  // flashing it at someone it should never appear for.
  $("#gear").hidden = true;
  api("/api/plugins").then(() => { $("#gear").hidden = false; }).catch(() => {});
  const list = await api("/api/conversations");
  if (list.length) await openConvo(list[0].id); else { showEmpty(); await loadConvos(); }
  $("#text").focus();
}

if (token) {
  api("/api/conversations").then(start).catch(() => {
    localStorage.removeItem("wren_token"); token = "";
  });
}
</script>
</body>
</html>
