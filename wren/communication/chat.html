<title>Wren</title>
<!-- Inlined from Brand/favicon/favicon.svg so the page stays one self-contained
     file with no external requests. Regenerate with:
     cd Brand && python3 build.py && python3 render_pngs.py  -- then re-inline. -->

<meta name="theme-color" content="#C4694A">
<style>
:root {
  --bg: #faf9f7; --panel: #f0eeea; --line: #ddd9d2; --text: #26241f;
  --muted: #6f6a61; --accent: #5b6f4e; --bubble-user: #e4e9de; --code: #eceae5;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1a1917; --panel: #221f1c; --line: #34302b; --text: #ece8e1;
    --muted: #9a938a; --accent: #9dbb87; --bubble-user: #2b3327; --code: #14130f;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  display: flex; background: var(--bg); color: var(--text);
  font: 15px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
}
/* background: transparent is load-bearing, not tidiness. Without it a button
   that declares no background of its own gets the browser default -- white --
   while inheriting the dark theme's near-white text, so its label is painted
   white on white. The plugins panel shipped that way twice. Setting it here
   means a new button can never render as a blank box; rules below override
   where a real background is wanted. */
button { font: inherit; color: inherit; cursor: pointer; background: transparent; }

/* ── login ─────────────────────────────────────────────────────────────── */
#login { margin: auto; max-width: 380px; padding: 24px; text-align: center; }
/* Clear space is 0.35x the mark's height (Brand/README.md); at 190px wide the
   lockup is ~86px tall, so ~24-30px clear space wanted. The 18px margin plus
   #login's own 24px padding above and #login p's 20px margin below cover it. */
#brandmark { width: 190px; height: auto; display: block; margin: 0 auto 18px; }
#login p { color: var(--muted); margin: 0 0 20px; font-size: 14px; }
#login input {
  width: 100%; padding: 10px 12px; border: 1px solid var(--line);
  border-radius: 8px; background: var(--panel); color: var(--text); font: inherit;
}
#login button {
  width: 100%; margin-top: 10px; padding: 10px; border: 0; border-radius: 8px;
  background: var(--accent); color: var(--bg); font-weight: 600;
}
#login .err { color: #c0503f; font-size: 13px; min-height: 18px; margin-top: 8px; }

/* ── layout ────────────────────────────────────────────────────────────── */
#app { display: none; width: 100%; height: 100%; }
#app.on { display: flex; }
aside {
  width: 250px; flex: none; background: var(--panel);
  border-right: 1px solid var(--line); display: flex; flex-direction: column;
}
aside header {
  padding: 12px; border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 8px;
}
aside header b { flex: 1; font-size: 15px; display: flex; align-items: center; gap: 8px; }
/* Clear space 0.35 x height (Brand/README.md): at 20px that's a 7px minimum
   gap, so the 8px gap above already satisfies it. */
.sidemark { width: 20px; height: 20px; flex: none; }
#gear {
  border: 0; color: var(--muted); padding: 2px 6px; border-radius: 6px;
  font-size: 15px; line-height: 1;
}
#gear:hover { background: var(--bg); color: var(--text); }
#gear[hidden] { display: none; }
#new {
  border: 1px solid var(--line); background: transparent; border-radius: 6px;
  padding: 4px 10px; font-size: 13px;
}
#convos { flex: 1; overflow-y: auto; padding: 6px; }
.convo {
  display: flex; align-items: center; gap: 4px; padding: 7px 9px;
  border-radius: 6px; cursor: pointer; font-size: 14px;
}
.convo:hover { background: var(--bg); }
.convo.active { background: var(--bg); font-weight: 600; }
.convo span {
  flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.convo button {
  border: 0; background: transparent; color: var(--muted); padding: 2px 4px;
  border-radius: 4px; font-size: 12px; opacity: 0; line-height: 1;
}
.convo:hover button { opacity: 1; }
.convo button:hover { background: var(--line); }

/* ── plugins panel ─────────────────────────────────────────────────────── */
#plugins { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: flex; justify-content: flex-end; }
#plugins[hidden] { display: none; }
#plugins .sheet {
  width: 420px; max-width: 100%; background: var(--bg); height: 100%;
  display: flex; flex-direction: column; border-left: 1px solid var(--line);
}
#plugins header {
  display: flex; align-items: center; padding: 12px 16px;
  border-bottom: 1px solid var(--line);
}
#plugins header b { flex: 1; }
#plugins .pbody { flex: 1; overflow-y: auto; padding: 16px; }
#plugins h4 { margin: 18px 0 8px; font-size: 12px; letter-spacing: .08em;
              text-transform: uppercase; color: var(--muted); }
#plugins h4 small { text-transform: none; letter-spacing: 0; font-weight: 400; }
/* flex-wrap so .why's flex-basis:100% can actually take its own line. Without
   it the reason stays inline and squeezes the plugin name into two lines. */
.prow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
        padding: 8px 0; border-bottom: 1px solid var(--line); }
.prow .pname { flex: 1; }
.prow .why { flex-basis: 100%; color: var(--muted); font-size: 13px; }

/* The global `button` rule sets only font/color/cursor, so a button with no
   background of its own renders as a white browser default -- and inherits the
   theme's near-white text, making the label invisible on dark. Every other
   button on this page (#new, .convo button) declares its own background for
   exactly this reason; these two must too. */
.ptoggle {
  border: 1px solid var(--line); background: transparent; border-radius: 6px;
  padding: 4px 12px; font-size: 13px; min-width: 46px; color: var(--muted);
}
.ptoggle:hover { border-color: var(--line-2, var(--muted)); }
.ptoggle[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
#pclose {
  border: 0; background: transparent; color: var(--muted);
  padding: 2px 6px; border-radius: 4px; font-size: 14px; line-height: 1;
}
#pclose:hover { background: var(--line); }
.pset { display: flex; align-items: center; gap: 8px; padding: 6px 0; }
.pset label { flex: 1; font-size: 14px; }
.pset input { width: 190px; padding: 6px 8px; border: 1px solid var(--line);
              border-radius: 6px; background: var(--panel); color: var(--text); font: inherit; }
.perr { color: #c0503f; font-size: 13px; padding: 0 16px 12px; min-height: 18px; }

main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
#log { flex: 1; overflow-y: auto; padding: 24px 20px; }
#inner { max-width: 720px; margin: 0 auto; }
.msg { margin-bottom: 18px; display: flex; }
.msg.user { justify-content: flex-end; }
.msg .body {
  max-width: 82%; padding: 10px 14px; border-radius: 12px; overflow-wrap: anywhere;
}
.msg.user .body { background: var(--bubble-user); }
.msg.assistant .body { background: transparent; padding-left: 0; max-width: 100%; }
.msg .body > :first-child { margin-top: 0; }
.msg .body > :last-child { margin-bottom: 0; }
.msg pre {
  background: var(--code); padding: 10px 12px; border-radius: 8px;
  overflow-x: auto; font-size: 13px;
}
.msg code {
  background: var(--code); padding: 1px 5px; border-radius: 4px;
  font-size: 13px; font-family: ui-monospace, "SF Mono", Menlo, monospace;
}
.msg pre code { background: none; padding: 0; }
.msg a { color: var(--accent); }
.msg ul { padding-left: 20px; margin: 6px 0; }
.msg .dl { display: inline-block; margin-top: 6px; color: var(--accent); }
.card { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.card header { padding: .5rem .75rem; font-weight: 600; border-bottom: 1px solid var(--line); }
.card ul { list-style: none; margin: 0; padding: 0; }
.card li { display: flex; align-items: center; gap: .5rem; padding: .4rem .75rem; }
.card li + li { border-top: 1px solid var(--line); }
.card .citem { flex: 1; }
.card .cx { background: none; border: 0; cursor: pointer; opacity: .6; }
.card .cx:hover { opacity: 1; }
.card .cx:disabled { opacity: .3; cursor: default; }
.card .cempty, .card .csugg { margin: 0; padding: .5rem .75rem; opacity: .7; }
.card .cstatus { margin: 0; padding: .4rem .75rem; font-size: 13px; opacity: .75;
                 border-top: 1px solid var(--line); }
.card .cadd { display: flex; gap: .5rem; padding: .5rem .75rem; border-top: 1px solid var(--line); }
.card .cadd input { flex: 1; }
/* ── landing ───────────────────────────────────────────────────────────── */
#landing { text-align: center; margin-top: 14vh; }
.landmark { width: 28px; height: 28px; display: block; margin: 0 auto 10px; }
#greet { font-size: 22px; font-weight: 500; margin: 0 0 4px; }
#pills { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 18px; }
.pill {
  border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px;
  font-size: 13px; color: var(--muted);
}
.pill:hover { color: var(--text); border-color: var(--muted); }

.dots span {
  display: inline-block; width: 6px; height: 6px; margin-right: 3px;
  border-radius: 50%; background: var(--muted); animation: b 1.2s infinite;
}
.dots span:nth-child(2) { animation-delay: .2s }
.dots span:nth-child(3) { animation-delay: .4s }
@keyframes b { 0%,60%,100% { opacity:.25 } 30% { opacity:1 } }

footer { border-top: 1px solid var(--line); padding: 12px 20px; }
#composer { max-width: 720px; margin: 0 auto; display: flex; gap: 8px; }
#text {
  flex: 1; resize: none; padding: 10px 12px; border: 1px solid var(--line);
  border-radius: 10px; background: var(--panel); color: var(--text);
  font: inherit; max-height: 180px;
}
#send {
  border: 0; border-radius: 10px; background: var(--accent); color: var(--bg);
  padding: 0 18px; font-weight: 600;
}
#send:disabled { opacity: .5; cursor: default; }
#model {
  border: 1px solid var(--line); border-radius: 8px; background: var(--panel);
  color: var(--muted); font: inherit; font-size: 13px; padding: 4px 6px;
  /* #composer is display:flex with the default align-items:stretch, so
     without align-self this <select> grows to match #text's height (up to
     180px) as you type. max-width plus the overflow rules below stop a long
     id (e.g. a full openrouter slug) from squeezing #text down instead of
     just truncating with an ellipsis. */
  align-self: center; max-width: 160px; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap;
}
#modeltext { color: var(--muted); font-size: 13px; align-self: center; }
/* Reuses the same red already used for #login .err and .perr elsewhere in this
   file -- an established, already-tested error colour, not a new one-off. */
#modeltext.err { color: #c0503f; }
@media (max-width: 640px) { aside { width: 190px; } }
</style>
</head>
<body>

<!-- The Wren silhouette, defined once. Both the sidebar and the landing

</svg>

<div id="login">
  <!-- Inlined from Brand/brand/lockup.svg (mark + wordmark as outlines) so

<g transform="translate(20.48,20.48) scale(1.1200)">
<path d="M 4.00 49.38 C 6.66 48.28 15.11 44.77 18.50 43.36 C 19.67 40.97 21.14 36.12 23.52 33.10 C 25.89 30.08 31.17 21.52 36.34 20.72 C 41.51 19.92 48.30 26.23 53.07 28.53 C 57.83 30.82 63.37 33.72 66.45 35.22 C 69.53 36.72 73.47 41.00 74.81 39.12 C 76.15 37.24 82.96 14.19 84.29 10.13 C 85.93 11.14 94.36 16.36 96.00 17.38 C 94.44 21.83 86.20 45.12 84.85 49.16 C 83.50 53.20 82.12 61.31 79.83 65.89 C 77.54 70.47 74.07 77.50 68.68 81.50 C 63.29 85.49 55.26 89.66 47.49 89.86 C 39.72 90.07 31.67 86.61 26.30 82.61 C 20.94 78.61 18.59 71.06 16.82 67.00 C 15.06 62.94 14.96 58.76 15.15 56.97 C 15.35 55.17 17.72 52.86 18.50 51.61 C 15.11 51.09 6.66 49.79 4.00 49.38 Z" fill="#C4694A"/>
<path d="M 34.11 61.98 C 33.93 59.25 42.94 54.55 49.72 54.74 C 56.51 54.92 70.21 61.57 74.81 63.10 C 70.42 64.73 57.62 72.21 50.84 72.02 C 44.05 71.83 34.29 64.72 34.11 61.98 Z" fill="#A9553A"/>

<g transform="translate(154.24,105.28)"><path d="M0.45 -35.01 13.82 0.00H18.94L26.50 -23.23L34.11 0.00H39.17L52.74 -35.01H48.13L36.74 -5.70L28.48 -30.72H24.58L16.32 -5.70L5.18 -35.01Z M60.74 0.00H65.47V-20.42C65.47 -26.94 68.80 -30.53 75.39 -31.17V-35.84C70.34 -35.58 67.33 -33.86 65.47 -30.02V-35.01H60.74Z M82.18 -17.66C82.18 -7.30 90.30 0.83 100.67 0.83C108.61 0.83 115.46 -4.86 117.70 -11.52H112.77C110.78 -6.72 105.86 -3.52 100.54 -3.52C93.38 -3.52 87.30 -9.02 86.91 -15.94H118.59C118.59 -28.35 110.72 -35.84 100.35 -35.84C90.18 -35.84 82.18 -27.84 82.18 -17.66ZM87.04 -20.22C88.32 -26.94 93.63 -31.49 100.29 -31.49C107.07 -31.49 112.26 -27.20 113.86 -20.22Z M128.64 0.00H133.38V-19.26C133.38 -27.84 137.73 -31.49 144.06 -31.49C150.53 -31.49 154.88 -27.90 154.88 -18.37V0.00H159.62V-18.37C159.62 -30.66 153.41 -35.84 144.64 -35.84C140.03 -35.84 136.32 -34.05 133.38 -30.46V-35.01H128.64Z" fill="currentColor"/></g>

  <p>Paste a token from this Wren's <code>WREN_TOKENS</code> — the part
     <em>before</em> the colon. What follows it is the user id, not the token.</p>
  <input id="token" type="password" placeholder="token" autocomplete="current-password">
  <button id="signin">Connect</button>
  <div class="err" id="loginerr"></div>
</div>

<div id="app">
  <aside>
    <header><b>
      <!-- Inlined from Brand/brand/mark-simple.svg (one-colour silhouette --
           the full mark's wing/eye detail stops resolving below ~24px, and
           this icon renders at ~20px). Regenerate with:
           cd Brand && python3 build.py && python3 render_pngs.py  -- then re-inline.
           Decorative: the word "Wren" sits right next to it. -->
      <svg class="sidemark" aria-hidden="true"><use href="#wren-mark"/></svg>
      Wren</b><button id="gear" title="Plugins">⚙</button><button id="new">New</button></header>
    <div id="convos"></div>
  </aside>
  <main>
    <div id="log"><div id="inner"></div></div>
    <footer>
      <div id="composer">
        <textarea id="text" rows="1" placeholder="Message Wren…"></textarea>
        <select id="model" hidden></select>
        <span id="modeltext" hidden></span>
        <button id="send">Send</button>
      </div>
    </footer>
  </main>
</div>

<div id="plugins" hidden>
  <div class="sheet">
    <header><b>Plugins</b><button id="pclose">✕</button></header>
    <div class="pbody">
      <h4>Skills</h4><div id="pskills"></div>
      <h4>Channels <small>restart required</small></h4><div id="pchannels"></div>
      <h4>Settings</h4><div id="psettings"></div>
    </div>
    <div class="perr" id="perr"></div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
let token = localStorage.getItem("wren_token") || "";
let active = null, busy = false;

/* ── markdown ───────────────────────────────────────────────────────────
   Replies can contain text Wren did not write: web_skill summarises scraped
   pages and send_to_person relays other users' messages. So escape FIRST,
   then apply a fixed whitelist to the already-escaped string — this can never
   emit a tag the escaper didn't already neutralise. */
function esc(s) {
  // strip the private-use codepoint md() reserves for its code-fence
  // placeholders — otherwise text containing it could forge a placeholder and
  // resolve to an out-of-range block, rendering as "undefined"
  return s.replace(/\uE000/g, "")
          .replace(/&/g, "&amp;").replace(/</g, "&lt;")
          .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function md(src) {
  const blocks = [];
  let out = esc(src);
  // Fenced code first, parked so its contents aren't re-processed. The
  // placeholder uses a private-use codepoint, written as a JS escape so no
  // raw control byte lands in the HTML. A " 3 " style placeholder would
  // collide with any standalone number in prose ("step 3 of the process").
  out = out.replace(/```([\s\S]*?)```/g, (_, code) =>
    "\uE000" + (blocks.push("<pre><code>" + code.replace(/^\n/, "") + "</code></pre>") - 1) + "\uE000");
  out = out.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  out = out.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  out = out.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
  // only http/https survive — a javascript: href must not be constructible
  out = out.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  out = out.replace(/(^|\s)(https?:\/\/[^\s<]+)/g,
    '$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>');
  out = out.replace(/(?:^|\n)((?:[-*] .+\n?)+)/g, m =>
    "<ul>" + m.trim().split("\n").map(l => "<li>" + l.replace(/^[-*] /, "") + "</li>").join("") + "</ul>");
  out = out.replace(/\n/g, "<br>");
  return out.replace(/\uE000(\d+)\uE000/g, (_, i) => blocks[i]);
}

async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: { "Authorization": "Bearer " + token, "Content-Type": "application/json",
               ...(opts.headers || {}) },
  });
  if (res.status === 401) { signOut(); throw new Error("unauthorized"); }
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.statusText);
  return res.json();
}

function signOut() {
  localStorage.removeItem("wren_token"); token = "";
  $("#app").classList.remove("on"); $("#login").style.display = "";
  $("#loginerr").textContent = "That token was rejected.";
}

/* ── rendering ─────────────────────────────────────────────────────────── */
function bubble(role, html) {
  const d = document.createElement("div");
  d.className = "msg " + role;
  d.innerHTML = '<div class="body">' + html + "</div>";
  $("#inner").append(d);
  $("#log").scrollTop = $("#log").scrollHeight;
  return d;
}
function fileLink(f) {
  return '<a class="dl" download="' + esc(f.filename) +
         '" href="data:application/octet-stream;base64,' + f.data + '">⤓ ' +
         esc(f.filename) + "</a>";
}

/* ── cards ─────────────────────────────────────────────────────────────── */
// A card is live: it holds no rows of its own, it re-fetches through
// /api/dispatch. That is why every control ends by re-rendering from the
// server's response rather than mutating the DOM it already drew.
//
// `params` is the whole Ctx-shaped object (content, tags, ...), not just a
// bare string -- a filtered card (e.g. notes filtered to a tag) must be able
// to re-dispatch with that filter intact, so this must not narrow it down to
// "content" the way a single string argument would force it to.
async function dispatch(intent, params) {
  return api("/api/dispatch", {
    method: "POST",
    body: JSON.stringify({ intent, ...(params || {}) }),
  });
}

// One line of feedback inside the card itself -- never alert(). Used both for
// the skill's own reply text ("milk wasn't on the list.") and for a caught
// error's message, so a no-op click is never silently indistinguishable from
// a real one.
function cardStatus(mount, msg) {
  const el = mount.querySelector(".cstatus");
  if (!el) return;
  el.textContent = msg || "";
  el.hidden = !msg;
}

function shoppingCard(data, mount) {
  const items = data.items || [];
  const rows = items.map(i =>
    '<li><span class="citem">' + esc(i.text) + '</span>' +
    '<button class="cx" data-item="' + esc(i.text) + '" title="remove">✕</button></li>'
  ).join("");
  const sugg = (data.suggestions || []).length
    ? '<p class="csugg">You often get: ' +
      data.suggestions.map(esc).join(", ") + "</p>"
    : "";
  mount.innerHTML =
    '<div class="card shopping">' +
      '<header>Shopping · ' + items.length + "</header>" +
      (items.length ? "<ul>" + rows + "</ul>"
                    : '<p class="cempty">Nothing on the list.</p>') +
      sugg +
      '<p class="cstatus" hidden></p>' +
      '<form class="cadd"><input placeholder="add item…" aria-label="add item">' +
      "<button>+</button></form>" +
    "</div>";

  // Refresh after a mutation, sharing one path so both handlers redraw and
  // report the same way. `r` is the mutation's own response (its `replies`
  // carry the skill's own text, e.g. "milk wasn't on the list.", even on a
  // 200) -- that text must reach the card, or a no-op looks like a success.
  async function refresh(r) {
    const fresh = await dispatch("recall_shopping", {});
    if (fresh.cards && fresh.cards.length) {
      renderCard({ kind: "shopping", data: fresh.cards[0].data }, mount);
      cardStatus(mount, (r.replies || []).join(" "));
    } else {
      // guard against an empty cards[] (e.g. a malformed response) rather
      // than crash on fresh.cards[0]
      cardStatus(mount, (r.replies || []).join(" ") || "Could not refresh the list.");
    }
  }

  for (const b of mount.querySelectorAll(".cx")) {
    b.onclick = async () => {
      // F3: serialise dispatches per card -- an in-flight flag on the mount
      // node itself, so a second click while this one is outstanding is
      // simply ignored rather than racing it and possibly redrawing a
      // response that is already stale.
      if (mount._busy) return;
      mount._busy = true;
      b.disabled = true;
      try {
        const r = await dispatch("remove_shopping_item", { content: b.dataset.item });
        await refresh(r);
      } catch (e) {
        cardStatus(mount, e.message || "Something went wrong.");
      } finally {
        mount._busy = false;
        b.disabled = false;
      }
    };
  }
  mount.querySelector(".cadd").onsubmit = async e => {
    e.preventDefault();
    if (mount._busy) return;             // F3, as above
    const input = e.target.querySelector("input");
    const text = input.value.trim();
    if (!text) return;
    mount._busy = true;
    input.value = "";
    try {
      const r = await dispatch("add_shopping_item", { content: text });
      await refresh(r);
    } catch (err) {
      input.value = text;                // a failed add must not destroy what was typed
      cardStatus(mount, err.message || "Something went wrong.");
    } finally {
      mount._busy = false;
    }
  };
}

const CARDS = { shopping: shoppingCard };

function renderCard(card, mount) {
  const draw = CARDS[card.kind];
  if (!draw) return false;      // unknown kind: leave the prose bubble alone
  draw(card.data || {}, mount);
  return true;
}

// A stored card carries no rows, so re-fetch before drawing. Failure falls back
// to the prose that is already in the bubble.
async function mountStoredCard(card, mount) {
  try {
    const r = await dispatch(card.intent, card.params || {});
    if (r.cards && r.cards.length) renderCard(r.cards[0], mount);
  } catch (e) { /* prose stays */ }
}

async function loadConvos() {
  const list = await api("/api/conversations");
  const box = $("#convos");
  box.innerHTML = "";
  for (const c of list) {
    const el = document.createElement("div");
    el.className = "convo" + (c.id === active ? " active" : "");
    const name = document.createElement("span");
    name.textContent = c.title;
    el.append(name);
    for (const [label, fn] of [["✎", () => renameConvo(c)], ["✕", () => delConvo(c)]]) {
      const b = document.createElement("button");
      b.textContent = label;
      b.onclick = e => { e.stopPropagation(); fn(); };
      el.append(b);
    }
    el.onclick = () => openConvo(c.id);
    box.append(el);
  }
}

async function renameConvo(c) {
  const title = prompt("Rename conversation", c.title);
  if (title === null || !title.trim()) return;
  await api("/api/conversations/" + c.id, { method: "PATCH", body: JSON.stringify({ title }) });
  loadConvos();
}
async function delConvo(c) {
  if (!confirm("Delete “" + c.title + "”?")) return;
  await api("/api/conversations/" + c.id, { method: "DELETE" });
  if (active === c.id) { active = null; $("#inner").innerHTML = ""; showEmpty(); }
  loadConvos();
}
const STARTERS = {
  shopping_skill: "add ",
  notes_skill:    "remember that ",
  reminder_skill: "remind me to ",
  pins_skill:     "pin: ",
  web_skill:      "look up ",
};
// contacts_skill is deliberately absent: it is owner-only administration, not
// something to invite a household member into. A module with no starter here
// simply renders no pill, which is also what a disabled skill does.

function greeting(name) {
  const h = new Date().getHours();   // the reader's clock, not the host's --
  // TIMEZONE exists so reminders fire correctly on the server, which is a
  // different question from what time it is where you are sitting.
  const part = h < 12 ? "morning" : h < 18 ? "afternoon" : "evening";
  return name ? `Good ${part}, ${name}.` : `Good ${part}.`;
}

async function showEmpty(mePromise) {
  const inner = $("#inner");
  inner.innerHTML = `<div id="landing">
      <svg class="landmark" aria-hidden="true"><use href="#wren-mark"/></svg>
      <h2 id="greet"></h2>
      <div id="pills"></div>
    </div>`;
  // Captured now, not re-queried after the await below: if a later caller
  // (double-click "New", or send() on the very first message of a fresh
  // install) rebuilds #inner or removes #landing before /api/me resolves,
  // this reference stops matching what's on the page and the isConnected
  // check further down bails instead of writing a greeting/pills into a
  // landing screen that already isn't the one showing.
  const landing = $("#landing");
  // Render the fallback greeting first so the screen is never blank or
  // waiting: /api/me only upgrades it with a name.
  $("#greet").textContent = greeting(null);
  let me;
  try {
    // start() already has an /api/me in flight for the model selector's
    // fallback and passes it in here so the same page load doesn't fetch it
    // twice. Later calls (delConvo, openConvo, a fresh "New") pass nothing
    // and get their own current fetch.
    me = await (mePromise || api("/api/me"));
  } catch (e) {
    return;                       // greeting stays; no pills
  }
  if (!landing.isConnected) return;   // superseded while /api/me was in flight
  $("#greet").textContent = greeting(me.name);
  me.skills.filter(m => STARTERS[m]).forEach(m => {
    const b = document.createElement("button");
    b.className = "pill";
    b.textContent = m.replace("_skill", "").replace(/^./, c => c.toUpperCase());
    b.onclick = () => {
      $("#text").value = STARTERS[m];
      $("#text").focus();
      $("#text").setSelectionRange($("#text").value.length, $("#text").value.length);
    };
    $("#pills").appendChild(b);
  });
}

async function openConvo(id) {
  active = id;
  const convo = await api("/api/conversations/" + id);
  $("#inner").innerHTML = "";
  if (!convo.messages.length) showEmpty();
  for (const m of convo.messages) {
    const b = bubble(m.role, m.role === "user" ? esc(m.content) : md(m.content));
    if (m.card) mountStoredCard(m.card, b.querySelector(".body"));
  }
  loadConvos();
  $("#text").focus();
}

async function newConvo() {
  const c = await api("/api/conversations", { method: "POST" });
  await loadConvos();
  await openConvo(c.id);
}

async function send() {
  const text = $("#text").value.trim();
  if (!text || busy) return;
  if (active === null) await newConvo();
  busy = true; $("#send").disabled = true;
  $("#text").value = ""; $("#text").style.height = "auto";
  const gone = $("#landing"); if (gone) gone.remove();
  bubble("user", esc(text));
  const thinking = bubble("assistant", '<div class="dots"><span></span><span></span><span></span></div>');
  try {
    const data = await api("/api/conversations/" + active + "/message",
                           { method: "POST", body: JSON.stringify({ text }) });
    thinking.remove();
    if ((data.cards || []).length) {
      // one bubble per card; its prose is the fallback if the kind is unknown
      for (const c of data.cards) {
        const b = bubble("assistant", md(c.text || ""));
        renderCard(c, b.querySelector(".body"));
      }
    } else {
      for (const r of data.replies) bubble("assistant", md(r));
    }
    for (const f of data.files || []) bubble("assistant", fileLink(f));
    if (!data.replies.length && !(data.files || []).length) bubble("assistant", "<em>(no reply)</em>");
    loadConvos();
  } catch (e) {
    thinking.remove();
    bubble("assistant", '<em>' + esc(e.message || "Something went wrong.") + "</em>");
  } finally {
    busy = false; $("#send").disabled = false; $("#text").focus();
  }
}

/* ── plugins panel ─────────────────────────────────────────────────────── */
async function loadPlugins() {
  const d = await api("/api/plugins");

  $("#pskills").innerHTML = "";
  d.skills.forEach(s => {
    const row = document.createElement("div");
    row.className = "prow";
    // aria-pressed is both the correct semantics for a toggle button and the
    // hook .ptoggle[aria-pressed="true"] styles the enabled state from.
    row.innerHTML = `<span class="pname"></span>
                     <button class="ptoggle" aria-pressed="${s.enabled}">${s.enabled ? "on" : "off"}</button>`;
    row.querySelector(".pname").textContent = s.name;
    row.querySelector(".ptoggle").onclick = async () => {
      await api(`/api/plugins/${s.module}`,
                { method: "PATCH", body: JSON.stringify({ enabled: !s.enabled }) });
      loadPlugins();
    };
    if (s.reason) {
      const why = document.createElement("div");
      why.className = "why";
      why.textContent = s.reason;
      row.appendChild(why);
    }
    $("#pskills").appendChild(row);
  });

  // Channels are read-only status: COMMUNICATION_PLUGINS is read once by
  // run.py at startup, so a toggle here could never take effect -- the
  // endpoint itself refuses with a 400 for this reason.
  $("#pchannels").innerHTML = "";
  d.channels.forEach(c => {
    const row = document.createElement("div");
    row.className = "prow";
    row.innerHTML = `<span class="pname"></span><span>${c.running ? "● live" : "○ off"}</span>`;
    row.querySelector(".pname").textContent = `${c.name} (${c.role})`;
    if (c.reason) {
      const why = document.createElement("div");
      why.className = "why";
      why.textContent = c.reason;
      row.appendChild(why);
    }
    $("#pchannels").appendChild(row);
  });

  $("#psettings").innerHTML = "";
  Object.entries(d.settings).forEach(([key, value]) => {
    const row = document.createElement("div");
    row.className = "pset";
    row.innerHTML = `<label></label><input>`;
    row.querySelector("label").textContent = key;
    const input = row.querySelector("input");
    input.value = value;
    input.onchange = async () => {
      $("#perr").textContent = "";
      try {
        await api("/api/settings",
                  { method: "PATCH", body: JSON.stringify({ [key]: input.value }) });
      } catch (e) {
        $("#perr").textContent = String(e.message || e);
      }
      loadPlugins();
    };
    $("#psettings").appendChild(row);
  });
}

/* ── wiring ────────────────────────────────────────────────────────────── */
$("#signin").onclick = async () => {
  const v = $("#token").value.trim();
  if (!v) return;
  token = v;
  try {
    await api("/api/conversations");
    localStorage.setItem("wren_token", v);
    start();
  } catch { $("#loginerr").textContent = "That token was rejected."; }
};
$("#token").onkeydown = e => { if (e.key === "Enter") $("#signin").click(); };
$("#new").onclick = newConvo;
$("#send").onclick = send;
$("#text").onkeydown = e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
};
$("#text").oninput = e => {
  e.target.style.height = "auto";
  e.target.style.height = Math.min(e.target.scrollHeight, 180) + "px";
};
$("#gear").onclick = () => { $("#plugins").hidden = false; loadPlugins(); };
$("#pclose").onclick = () => { $("#plugins").hidden = true; };
$("#plugins").onclick = e => { if (e.target.id === "plugins") $("#plugins").hidden = true; };

async function loadModels(fallbackModel) {
  let d;
  try {
    d = await api("/api/models");
  } catch (e) {
    // 403 for a non-owner, or the request failed. Fail closed to static text,
    // using the model /api/me already told us about.
    $("#modeltext").textContent = fallbackModel || "";
    $("#modeltext").hidden = !fallbackModel;
    return;
  }
  if (!d.models.length) {                 // owner, but the provider is down (or unconfigured)
    // d.reason says WHY the list is empty -- without it "the list failed to
    // load" and "this is simply the model" render as identical text.
    const text = d.reason ? [d.current, d.reason].filter(Boolean).join(" — ") : (d.current || "");
    $("#modeltext").textContent = text;
    $("#modeltext").hidden = !text;
    return;
  }
  $("#model").innerHTML = "";
  // d.current might not be IN d.models -- e.g. OLLAMA_MODEL names a model
  // since removed from the host, or LM Studio only lists currently LOADED
  // models. The loop below only ever *selects* an existing option, so without
  // this, nothing would be selected and the browser would silently default to
  // d.models[0] -- displaying a model that is not the one actually answering,
  // with no indication anything is wrong. Prepending an option for it keeps
  // the visible selection truthful: the label explains the mismatch, but the
  // VALUE stays the bare model id, since that's what gets PATCHed.
  if (d.current && !d.models.includes(d.current)) {
    const o = document.createElement("option");
    o.value = d.current;
    o.textContent = `${d.current} (not offered by ${d.provider})`;
    o.selected = true;
    $("#model").appendChild(o);
  }
  d.models.forEach(m => {
    const o = document.createElement("option");
    o.value = m; o.textContent = m; o.selected = (m === d.current);
    $("#model").appendChild(o);
  });
  $("#model").hidden = false;
  $("#model").onchange = async () => {
    const key = d.provider.toUpperCase() + "_MODEL";
    const chosen = $("#model").value;
    $("#modeltext").hidden = true; $("#modeltext").classList.remove("err");
    try {
      await api("/api/settings", { method: "PATCH",
        body: JSON.stringify({ [key]: chosen }) });
      d.current = chosen;   // keep our snapshot in sync so a later failed
                             // change has the right value to revert to
    } catch (e) {
      // PATCH /api/settings can genuinely 400 here -- config.set_override
      // rejects a model that fails to resolve. Revert the visible selection
      // to the last value that actually saved (simpler than re-fetching
      // /api/models, and d.current is already the source of truth we have in
      // hand) rather than let the dropdown show a choice the server never
      // accepted as though it had taken.
      $("#model").value = d.current;
      $("#modeltext").textContent = "Couldn't switch model: " + (e.message || "unknown error");
      $("#modeltext").hidden = false; $("#modeltext").classList.add("err");
    }
  };
}

async function start() {
  $("#login").style.display = "none";
  $("#app").classList.add("on");
  // The endpoint 403s for non-owners -- use that to decide whether the gear
  // is even shown, and fail closed (hidden) on any error rather than risk
  // flashing it at someone it should never appear for.
  $("#gear").hidden = true;
  api("/api/plugins").then(() => { $("#gear").hidden = false; }).catch(() => {});
  // Fetched once and shared: the model selector's fallback needs .model, and
  // showEmpty() (below) needs the same response for the greeting and pills.
  // Two independent calls here previously fetched /api/me twice on every page
  // load; awaiting the same promise from both places makes one network
  // request serve both, and each still fails closed independently.
  const me = api("/api/me");
  me.then(m => loadModels(m.model)).catch(() => loadModels(null));
  const list = await api("/api/conversations");
  if (list.length) await openConvo(list[0].id); else { showEmpty(me); await loadConvos(); }
  $("#text").focus();
}

if (token) {
  api("/api/conversations").then(start).catch(() => {
    localStorage.removeItem("wren_token"); token = "";
  });
}
</script>
</body>
</html>
